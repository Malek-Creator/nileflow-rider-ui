<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Enter code | Nile Flow Rider</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: "class",
  theme: { extend: {
    colors: {
      "primary": "#005145", "primary-container": "#0f6b5c", "primary-fixed": "#a2f2de",
      "on-primary": "#ffffff", "secondary": "#7f5600", "secondary-fixed": "#ffdeae",
      "error": "#ba1a1a", "error-container": "#ffdad6", "on-error-container": "#93000a",
      "surface": "#fcf9f8", "surface-container-lowest": "#ffffff", "surface-container-low": "#f6f3f2",
      "surface-container": "#f0eded", "surface-container-high": "#eae7e7",
      "on-surface": "#1c1b1b", "on-surface-variant": "#3f4946",
      "outline": "#6f7976", "outline-variant": "#bec9c5"
    },
    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
    spacing: { "margin-mobile": "1rem", "space-xs": "0.5rem", "space-sm": "0.75rem", "space-md": "1rem", "space-lg": "1.5rem", "space-xl": "2rem" },
    fontFamily: {
      "headline-lg-mobile": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"],
      "body-md": ["Inter"], "body-md-bold": ["Inter"], "body-sm": ["Inter"],
      "body-lg-bold": ["Inter"], "label-lg": ["Inter"]
    },
    fontSize: {
      "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
      "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
      "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
      "body-md-bold": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
      "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
      "body-lg-bold": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
      "label-lg": ["14px", { "lineHeight": "20px", "fontWeight": "600" }]
    }
  } }
};
</script>
<style>
  html, body { margin: 0; padding: 0; }
  body { overscroll-behavior: none; }
  .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
  .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
</style>
</head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col pt-safe pb-safe">
<main class="flex-1 flex flex-col w-full max-w-md mx-auto px-margin-mobile">

  <div class="pt-space-sm flex items-center justify-between">
    <a href="../24_rider_sign_in_phone/code.html" aria-label="Back" class="w-11 h-11 -ml-2 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container active:bg-surface-container-high transition-colors">
      <span class="material-symbols-outlined text-[24px]">arrow_back</span>
    </a>
    <span class="flex items-center gap-1 font-headline-sm text-headline-sm text-primary">
      <span class="material-symbols-outlined text-[22px]">electric_moped</span>Nile Flow
    </span>
  </div>

  <div class="mt-space-lg flex flex-col gap-space-xs">
    <h1 class="font-headline-lg-mobile text-headline-lg-mobile">Enter the code</h1>
    <p class="font-body-md text-body-md text-on-surface-variant">
      We sent a 4-digit code to <span class="font-body-md-bold text-body-md-bold text-on-surface">+254 <span id="maskedPhone"></span></span>.
      <a href="../24_rider_sign_in_phone/code.html" class="font-body-md-bold text-body-md-bold text-primary underline underline-offset-4">Change number</a>
    </p>
  </div>

  <div id="codeRow" class="mt-space-xl flex gap-space-sm" role="group" aria-label="4-digit code">
    <input class="code-box w-14 h-16 text-center rounded-lg bg-surface-container-lowest shadow-sm ring-1 ring-outline-variant focus:ring-2 focus:ring-primary outline-none font-headline-lg-mobile text-headline-lg-mobile" type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1"/>
    <input class="code-box w-14 h-16 text-center rounded-lg bg-surface-container-lowest shadow-sm ring-1 ring-outline-variant focus:ring-2 focus:ring-primary outline-none font-headline-lg-mobile text-headline-lg-mobile" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2"/>
    <input class="code-box w-14 h-16 text-center rounded-lg bg-surface-container-lowest shadow-sm ring-1 ring-outline-variant focus:ring-2 focus:ring-primary outline-none font-headline-lg-mobile text-headline-lg-mobile" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3"/>
    <input class="code-box w-14 h-16 text-center rounded-lg bg-surface-container-lowest shadow-sm ring-1 ring-outline-variant focus:ring-2 focus:ring-primary outline-none font-headline-lg-mobile text-headline-lg-mobile" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4"/>
  </div>
  <p id="codeError" role="alert" class="mt-space-xs min-h-[16px] font-body-sm text-body-sm text-error"></p>

  <button id="verifyBtn" type="button" disabled class="mt-space-md w-full h-14 rounded-lg bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center shadow-md active:scale-[0.99] transition-all disabled:opacity-50">Verify and sign in</button>

  <div class="mt-space-md flex items-center justify-between">
    <button id="resendBtn" type="button" disabled class="min-h-[44px] font-label-lg text-label-lg text-primary disabled:text-outline">
      <span id="resendLabel">Resend code in 30s</span>
    </button>
    <span id="codeStatus" role="status" class="font-body-sm text-body-sm text-primary"></span>
  </div>

  <div class="mt-space-lg rounded-lg bg-secondary-fixed/40 p-space-sm flex items-start gap-space-xs">
    <span class="material-symbols-outlined text-[18px] text-secondary">info</span>
    <p class="font-body-sm text-body-sm text-on-surface">Demo mode: no SMS is sent. Use code <span class="font-body-md-bold text-body-md-bold">1234</span>.</p>
  </div>

</main>
<script>
(function () {
  var DEMO_CODE = '1234';
  var HOME = '../06_rider_command_center_dashboard/code.html';

  var boxes = Array.prototype.slice.call(document.querySelectorAll('.code-box'));
  var err = document.getElementById('codeError');
  var status = document.getElementById('codeStatus');
  var verifyBtn = document.getElementById('verifyBtn');
  var resendBtn = document.getElementById('resendBtn');
  var resendLabel = document.getElementById('resendLabel');
  var busy = false;

  // Masked number, like 712 ••• 678
  var phone = '';
  try { phone = sessionStorage.getItem('nf_phone') || ''; } catch (x) {}
  document.getElementById('maskedPhone').textContent =
    phone.length === 9 ? phone.slice(0, 3) + ' \u2022\u2022\u2022 ' + phone.slice(6) : '7\u2022\u2022 \u2022\u2022\u2022 \u2022\u2022\u2022';

  function getCode() {
    return boxes.map(function (b) { return b.value; }).join('');
  }
  function updateButton() {
    verifyBtn.disabled = busy || getCode().length !== 4;
  }
  function setError(msg) {
    err.textContent = msg;
    boxes.forEach(function (b) {
      b.classList.toggle('ring-error', !!msg);
      b.classList.toggle('ring-outline-variant', !msg);
    });
  }
  function clearBoxes() {
    boxes.forEach(function (b) { b.value = ''; });
    boxes[0].focus();
    updateButton();
  }

  function verify() {
    if (busy || getCode().length !== 4) return;
    if (getCode() !== DEMO_CODE) {
      setError('That code is not right. Check the SMS and try again.');
      clearBoxes();
      return;
    }
    busy = true;
    verifyBtn.disabled = true;
    verifyBtn.textContent = 'Signing you in...';
    try { localStorage.setItem('nf_signed_in', '1'); } catch (x) {}
    setTimeout(function () { location.href = HOME; }, 700);
  }

  boxes.forEach(function (box, i) {
    box.addEventListener('focus', function () { box.select(); });

    box.addEventListener('input', function () {
      box.value = box.value.replace(/\D/g, '').slice(-1);
      setError('');
      if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
      updateButton();
      verify();
    });

    box.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && !box.value && i > 0) {
        boxes[i - 1].value = '';
        boxes[i - 1].focus();
        updateButton();
      } else if (e.key === 'ArrowLeft' && i > 0) {
        boxes[i - 1].focus();
      } else if (e.key === 'ArrowRight' && i < boxes.length - 1) {
        boxes[i + 1].focus();
      }
    });

    box.addEventListener('paste', function (e) {
      var text = ((e.clipboardData || window.clipboardData).getData('text') || '').replace(/\D/g, '').slice(0, 4);
      if (!text) return;
      e.preventDefault();
      boxes.forEach(function (b, k) { b.value = text.charAt(k) || ''; });
      boxes[Math.min(text.length, 3)].focus();
      setError('');
      updateButton();
      verify();
    });
  });

  verifyBtn.addEventListener('click', verify);

  // Resend timer
  var secs = 30;
  var tick = null;
  function startTimer() {
    secs = 30;
    resendBtn.disabled = true;
    resendLabel.textContent = 'Resend code in 30s';
    clearInterval(tick);
    tick = setInterval(function () {
      secs -= 1;
      if (secs <= 0) {
        clearInterval(tick);
        resendBtn.disabled = false;
        resendLabel.textContent = 'Resend code';
      } else {
        resendLabel.textContent = 'Resend code in ' + secs + 's';
      }
    }, 1000);
  }
  resendBtn.addEventListener('click', function () {
    if (resendBtn.disabled) return;
    setError('');
    clearBoxes();
    startTimer();
    status.textContent = 'New code sent.';
    setTimeout(function () { status.textContent = ''; }, 3000);
  });

  startTimer();
  boxes[0].focus();
})();
</script>
<script src="../screens-menu.js"></script>
</body>
</html>
