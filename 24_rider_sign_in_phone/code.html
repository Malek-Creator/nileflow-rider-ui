<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Sign in | Nile Flow Rider</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: "class",
  theme: { extend: {
    colors: {
      "primary": "#005145", "primary-container": "#0f6b5c", "primary-fixed": "#a2f2de",
      "on-primary": "#ffffff", "secondary": "#7f5600", "secondary-fixed": "#ffdeae",
      "error": "#ba1a1a", "error-container": "#ffdad6", "on-error-container": "#93000a",
      "surface": "#fcf9f8", "surface-container-lowest": "#ffffff", "surface-container-low": "#f6f3f2",
      "surface-container": "#f0eded", "surface-container-high": "#eae7e7",
      "on-surface": "#1c1b1b", "on-surface-variant": "#3f4946",
      "outline": "#6f7976", "outline-variant": "#bec9c5"
    },
    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
    spacing: { "margin-mobile": "1rem", "space-xs": "0.5rem", "space-sm": "0.75rem", "space-md": "1rem", "space-lg": "1.5rem", "space-xl": "2rem" },
    fontFamily: {
      "headline-lg-mobile": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"],
      "body-md": ["Inter"], "body-md-bold": ["Inter"], "body-sm": ["Inter"],
      "body-lg-bold": ["Inter"], "label-lg": ["Inter"]
    },
    fontSize: {
      "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
      "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
      "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
      "body-md-bold": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
      "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
      "body-lg-bold": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
      "label-lg": ["14px", { "lineHeight": "20px", "fontWeight": "600" }]
    }
  } }
};
</script>
<style>
  html, body { margin: 0; padding: 0; }
  body { overscroll-behavior: none; }
  .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
  .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
</style>
</head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col pt-safe pb-safe">
<main class="flex-1 flex flex-col w-full max-w-md mx-auto px-margin-mobile">

  <div class="pt-space-sm flex items-center justify-between">
    <a href="../01_rider_splash_authentication/index.html" aria-label="Back" class="w-11 h-11 -ml-2 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container active:bg-surface-container-high transition-colors">
      <span class="material-symbols-outlined text-[24px]">arrow_back</span>
    </a>
    <span class="flex items-center gap-1 font-headline-sm text-headline-sm text-primary">
      <span class="material-symbols-outlined text-[22px]">electric_moped</span>Nile Flow
    </span>
  </div>

  <div class="mt-space-lg flex flex-col gap-space-xs">
    <h1 class="font-headline-lg-mobile text-headline-lg-mobile">Sign in to your shift</h1>
    <p class="font-body-md text-body-md text-on-surface-variant">Enter the phone number you registered with. We will text you a 4-digit code.</p>
  </div>

  <form id="phoneForm" class="mt-space-xl flex flex-col gap-space-md" novalidate>
    <div class="flex flex-col gap-space-xs">
      <label for="phone" class="font-label-lg text-label-lg">Phone number</label>
      <div class="flex items-stretch rounded-lg bg-surface-container-lowest shadow-sm ring-1 ring-outline-variant focus-within:ring-2 focus-within:ring-primary">
        <span class="flex items-center pl-space-md pr-space-xs font-body-md-bold text-body-md-bold text-on-surface-variant select-none">+254</span>
        <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="712 345 678" maxlength="11" aria-describedby="phoneError" class="w-full h-12 pr-space-md bg-transparent outline-none font-body-lg-bold text-body-lg-bold tracking-wide placeholder:text-outline placeholder:font-normal"/>
      </div>
      <p id="phoneError" role="alert" class="min-h-[16px] font-body-sm text-body-sm text-error"></p>
    </div>
    <button id="sendBtn" type="submit" class="w-full h-14 rounded-lg bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center shadow-md active:scale-[0.99] transition-all disabled:opacity-60">Send code</button>
  </form>

  <p class="mt-space-lg font-body-md text-body-md text-on-surface-variant">
    New rider? <a href="../02_rider_onboarding_profile_setup/code.html" class="font-body-md-bold text-body-md-bold text-primary underline underline-offset-4">Become a partner</a>
  </p>

  <a href="tel:+254700000000" class="mt-auto mb-space-lg pt-space-xl flex items-center justify-center gap-2 min-h-[44px] font-label-lg text-label-lg text-primary">
    <span class="material-symbols-outlined text-[20px]">support_agent</span>
    Can't sign in? Call dispatch
  </a>

</main>
<script>
(function () {
  var form = document.getElementById('phoneForm');
  var input = document.getElementById('phone');
  var err = document.getElementById('phoneError');
  var btn = document.getElementById('sendBtn');

  function digitsOnly(v) { return v.replace(/\D/g, ''); }
  function format(d) {
    var out = d.slice(0, 3);
    if (d.length > 3) out += ' ' + d.slice(3, 6);
    if (d.length > 6) out += ' ' + d.slice(6, 9);
    return out;
  }

  // Coming back from the code screen: show the number again
  try {
    var saved = sessionStorage.getItem('nf_phone');
    if (saved) input.value = format(saved);
  } catch (x) {}

  input.addEventListener('input', function () {
    var d = digitsOnly(input.value);
    if (d.indexOf('254') === 0 && d.length > 9) d = d.slice(3);
    if (d.charAt(0) === '0') d = d.slice(1);
    input.value = format(d.slice(0, 9));
    err.textContent = '';
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var d = digitsOnly(input.value);
    if (!/^[17]\d{8}$/.test(d)) {
      err.textContent = 'Enter a 9-digit Kenyan number that starts with 7 or 1, for example 712 345 678.';
      input.focus();
      return;
    }
    try { sessionStorage.setItem('nf_phone', d); } catch (x) {}
    btn.disabled = true;
    btn.textContent = 'Sending code...';
    setTimeout(function () {
      location.href = '../25_rider_sign_in_code/code.html';
    }, 700);
  });
})();
</script>
<script src="../screens-menu.js"></script>
</body>
</html>
