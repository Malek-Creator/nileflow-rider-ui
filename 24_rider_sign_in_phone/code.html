<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Sign in | Nile Flow Rider</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: "class",
  theme: { extend: {
    colors: {
      "primary": "#005145", "primary-container": "#0f6b5c", "primary-fixed": "#a2f2de",
      "on-primary": "#ffffff", "secondary": "#7f5600", "secondary-fixed": "#ffdeae",
      "error": "#ba1a1a", "error-container": "#ffdad6", "on-error-container": "#93000a",
      "surface": "#fcf9f8", "surface-container-lowest": "#ffffff", "surface-container-low": "#f6f3f2",
      "surface-container": "#f0eded", "surface-container-high": "#eae7e7",
      "on-surface": "#1c1b1b", "on-surface-variant": "#3f4946",
      "outline": "#6f7976", "outline-variant": "#bec9c5"
    },
    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
    spacing: { "margin-mobile": "1rem", "space-xs": "0.5rem", "space-sm": "0.75rem", "space-md": "1rem", "space-lg": "1.5rem", "space-xl": "2rem" },
    fontFamily: {
      "headline-lg-mobile": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"],
      "body-md": ["Inter"], "body-md-bold": ["Inter"], "body-sm": ["Inter"],
      "body-lg-bold": ["Inter"], "label-lg": ["Inter"]
    },
    fontSize: {
      "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
      "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
      "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
      "body-md-bold": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
      "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
      "body-lg-bold": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
      "label-lg": ["14px", { "lineHeight": "20px", "fontWeight": "600" }]
    }
  } }
};
</script>
<style>
  html, body { margin: 0; padding: 0; }
  body { overscroll-behavior: none; }
  .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
  .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
</style>
</head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col pt-safe pb-safe">
<main class="flex-1 flex flex-col w-full max-w-md mx-auto px-margin-mobile">

  <div class="pt-space-sm flex items-center justify-between">
    <a href="../01_rider_splash_authentication/index.html" aria-label="Back" class="w-11 h-11 -ml-2 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container active:bg-surface-container-high transition-colors">
      <span class="material-symbols-outlined text-[24px]">arrow_back</span>
    </a>
    <span class="flex items-center gap-1 font-headline-sm text-headline-sm text-primary">
      <span class="material-symbols-outlined text-[22px]">electric_moped</span>Nile Flow
    </span>
  </div>

  <div class="mt-space-lg flex flex-col gap-space-xs">
    <h1 class="font-headline-lg-mobile text-headline-lg-mobile">Sign in to your shift</h1>
    <p class="font-body-md text-body-md text-on-surface-variant">Use the email and password for your Nile Flow rider account.</p>
  </div>

  <div id="loginNotice" class="mt-space-md"></div>

  <form id="loginForm" class="mt-space-lg flex flex-col gap-space-md" novalidate>
    <div class="flex flex-col gap-space-xs">
      <label for="email" class="font-label-lg text-label-lg">Email address</label>
      <div class="flex items-stretch rounded-lg bg-surface-container-lowest shadow-sm ring-1 ring-outline-variant focus-within:ring-2 focus-within:ring-primary">
        <span class="flex items-center pl-space-md pr-space-xs text-on-surface-variant">
          <span class="material-symbols-outlined text-[20px]">mail</span>
        </span>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="you@example.com" aria-describedby="emailError" class="w-full h-12 pr-space-md bg-transparent outline-none font-body-md text-body-md placeholder:text-outline"/>
      </div>
      <p id="emailError" role="alert" class="min-h-[16px] font-body-sm text-body-sm text-error"></p>
    </div>

    <div class="flex flex-col gap-space-xs">
      <label for="password" class="font-label-lg text-label-lg">Password</label>
      <div class="flex items-stretch rounded-lg bg-surface-container-lowest shadow-sm ring-1 ring-outline-variant focus-within:ring-2 focus-within:ring-primary">
        <span class="flex items-center pl-space-md pr-space-xs text-on-surface-variant">
          <span class="material-symbols-outlined text-[20px]">lock</span>
        </span>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" aria-describedby="passwordError" class="w-full h-12 bg-transparent outline-none font-body-md text-body-md placeholder:text-outline"/>
        <button id="togglePassword" type="button" aria-label="Show password" class="w-12 flex items-center justify-center text-on-surface-variant">
          <span class="material-symbols-outlined text-[20px]">visibility</span>
        </button>
      </div>
      <p id="passwordError" role="alert" class="min-h-[16px] font-body-sm text-body-sm text-error"></p>
    </div>

    <p id="formError" role="alert" class="min-h-[16px] font-body-sm text-body-sm text-error"></p>

    <button id="signInBtn" type="submit" class="w-full h-14 rounded-lg bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center shadow-md active:scale-[0.99] transition-all disabled:opacity-60">Sign in</button>
  </form>

  <p class="mt-space-lg font-body-md text-body-md text-on-surface-variant">
    New rider? <a href="../02_rider_onboarding_profile_setup/code.html" class="font-body-md-bold text-body-md-bold text-primary underline underline-offset-4">Become a partner</a>
  </p>

  <a href="tel:+254700000000" class="mt-auto mb-space-lg pt-space-xl flex items-center justify-center gap-2 min-h-[44px] font-label-lg text-label-lg text-primary">
    <span class="material-symbols-outlined text-[20px]">support_agent</span>
    Trouble signing in? Call dispatch
  </a>

</main>
<script src="../assets/api.js"></script>
<script src="../assets/auth.js"></script>
<script src="../assets/ui.js"></script>
<script>
(function () {
  var form = document.getElementById('loginForm');
  var email = document.getElementById('email');
  var password = document.getElementById('password');
  var emailError = document.getElementById('emailError');
  var passwordError = document.getElementById('passwordError');
  var formError = document.getElementById('formError');
  var btn = document.getElementById('signInBtn');
  var toggle = document.getElementById('togglePassword');
  var notice = document.getElementById('loginNotice');
  var busy = false;

  if (NFUI.param('expired') === '1') {
    NFUI.banner(notice, 'Your session expired. Sign in again to continue where you left off.', 'warn');
  }

  // If the rider already has a valid session, skip this screen.
  if (!NFUI.param('expired')) {
    NFAuth.redirectIfSignedIn();
  }

  toggle.addEventListener('click', function () {
    var showing = password.type === 'text';
    password.type = showing ? 'password' : 'text';
    toggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    toggle.querySelector('.material-symbols-outlined').textContent = showing ? 'visibility' : 'visibility_off';
  });

  email.addEventListener('input', function () { emailError.textContent = ''; formError.textContent = ''; });
  password.addEventListener('input', function () { passwordError.textContent = ''; formError.textContent = ''; });

  function validate() {
    var ok = true;
    emailError.textContent = '';
    passwordError.textContent = '';
    formError.textContent = '';
    var value = email.value.trim();
    if (!value) {
      emailError.textContent = 'Enter the email address for your rider account.';
      ok = false;
    } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
      emailError.textContent = 'Enter a valid email address, for example rider@example.com.';
      ok = false;
    }
    if (!password.value) {
      passwordError.textContent = 'Enter your password.';
      ok = false;
    }
    return ok;
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    if (busy) return;
    if (!validate()) {
      (emailError.textContent ? email : password).focus();
      return;
    }

    busy = true;
    NFUI.setBusy(btn, true, 'Signing in…');
    NFAuth.login(email.value.trim().toLowerCase(), password.value)
      .then(function (rider) {
        if (!rider) throw new Error('Sign in did not return a rider profile. Please try again.');
        window.location.replace(NFAuth.safeNext() || NFAuth.ROUTES.dashboard);
      })
      .catch(function (err) {
        busy = false;
        NFUI.setBusy(btn, false);
        var message = err && err.message ? err.message : 'Sign in failed. Please try again.';
        if (err && (err.status === 401 || err.status === 400)) {
          formError.textContent = message || 'Email or password is incorrect.';
          password.value = '';
          password.focus();
        } else {
          formError.textContent = message;
        }
      });
  });
})();
</script>
<script src="../screens-menu.js"></script>
</body>
</html>
